<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <meta name="theme-color" content="#1f2933" />
  <title>Archive</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="pinScreen" class="pin-screen">
    <section class="pin-card">
      <p class="app-kicker">Private Records</p>
      <h1>Archive</h1>
      <p class="muted">PINを入力してください</p>
      <input
        id="pinInput"
        class="pin-input"
        type="password"
        inputmode="numeric"
        maxlength="8"
        autocomplete="off"
        placeholder="PIN"
      />
      <button id="unlockButton" class="primary-button">開く</button>
      <p id="pinMessage" class="error-message"></p>
    </section>
  </div>

  <div id="appRoot" class="app-root hidden">
    <header class="app-header">
      <button id="openSettingsButton" class="title-button" type="button">
        <span class="app-kicker">Document Archive</span>
        <span class="app-title">Archive</span>
      </button>
      <button id="lockButton" class="ghost-button">ロック</button>
    </header>

    <main class="layout">
      <section class="control-panel">
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">全件</span>
            <strong id="totalCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">お気に入り</span>
            <strong id="favoriteCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">ゴミ箱</span>
            <strong id="trashCount">0</strong>
          </div>
        </div>

        <div class="search-row">
          <input
            id="searchInput"
            type="search"
            placeholder="メモ・タグ・カテゴリで検索"
          />
          <select id="filterSelect">
            <option value="active">通常</option>
            <option value="favorite">お気に入り</option>
            <option value="unorganized">未整理</option>
            <option value="nsfw">NSFW</option>
            <option value="trash">ゴミ箱</option>
          </select>
        </div>
      </section>

      <section class="editor-panel">
        <h2>画像登録</h2>

        <div class="form-grid">
          <label>
            画像
            <input id="imageInput" type="file" accept="image/*" />
          </label>

          <label>
            カテゴリ
            <select id="categoryInput">
              <option value="未分類">未分類</option>
              <option value="イラスト">イラスト</option>
              <option value="漫画">漫画</option>
              <option value="アニメ">アニメ</option>
              <option value="ロボ">ロボ</option>
              <option value="服">服</option>
              <option value="背景">背景</option>
              <option value="ポーズ">ポーズ</option>
              <option value="表情">表情</option>
              <option value="構図">構図</option>
              <option value="色彩">色彩</option>
              <option value="その他">その他</option>
            </select>
          </label>

          <label>
            タグ（カンマ区切り）
            <input
              id="tagsInput"
              type="text"
              list="tagSuggestions"
              placeholder="黒髪, 逆光, 構図"
            />
          </label>

          <div class="tag-helper">
            <p class="helper-label">候補タグ</p>
            <div id="tagSuggestionChips" class="tag-suggestion-chips"></div>
          </div>

          <label>
            メモ
            <textarea
              id="memoInput"
              rows="4"
              placeholder="なぜ保存したか、何が刺さったか"
            ></textarea>
          </label>
        </div>

        <div class="check-row">
          <label>
            <input id="favoriteInput" type="checkbox" />
            お気に入り
          </label>
          <label>
            <input id="nsfwInput" type="checkbox" />
            NSFW
          </label>
        </div>

        <button id="saveButton" class="primary-button">保存</button>
        <p id="formMessage" class="form-message"></p>
      </section>

      <section class="backup-panel">
        <h2>バックアップ</h2>

        <div class="button-row">
          <button id="exportButton" class="secondary-button">JSON Export</button>

          <label class="import-label">
            JSON Import
            <input id="importInput" type="file" accept="application/json" />
          </label>
        </div>
      </section>

      <section class="list-panel">
        <h2>一覧</h2>
        <div id="archiveList" class="archive-list"></div>
      </section>
    </main>
  </div>

  <div id="settingsRoot" class="settings-root hidden">
    <header class="app-header">
      <div>
        <p class="app-kicker">Archive Settings</p>
        <h1>設定</h1>
      </div>
      <button id="backFromSettingsButton" class="ghost-button">戻る</button>
    </header>

    <main class="layout">
      <section class="settings-panel">
        <h2>セキュリティ</h2>

        <div class="settings-grid">
          <label>
            現在のPIN
            <input
              id="currentPinInput"
              type="password"
              inputmode="numeric"
              maxlength="8"
              autocomplete="off"
              placeholder="現在のPIN"
            />
          </label>

          <label>
            新しいPIN
            <input
              id="newPinInput"
              type="password"
              inputmode="numeric"
              maxlength="8"
              autocomplete="off"
              placeholder="新しいPIN"
            />
          </label>

          <label>
            新しいPIN確認
            <input
              id="confirmPinInput"
              type="password"
              inputmode="numeric"
              maxlength="8"
              autocomplete="off"
              placeholder="もう一度入力"
            />
          </label>
        </div>

        <button id="changePinButton" class="primary-button">PINを変更</button>
        <p id="settingsMessage" class="form-message"></p>
      </section>

      <section class="settings-panel">
        <h2>自動ロック</h2>

        <label>
          操作がない場合のロック時間
          <select id="autoLockSelect">
            <option value="0">なし</option>
            <option value="1">1分</option>
            <option value="3">3分</option>
            <option value="5">5分</option>
            <option value="10">10分</option>
          </select>
        </label>
      </section>

      <section class="settings-panel">
        <h2>プライベート</h2>

        <div class="check-row">
          <label>
            <input id="blurNsfwInput" type="checkbox" />
            NSFWサムネイルをぼかす
          </label>
        </div>

        <p class="muted small-note">
          NSFWは通常一覧には表示されません。NSFW表示時はPIN再入力が必要です。
        </p>
      </section>

      <section class="settings-panel">
        <h2>データ管理</h2>

        <div class="button-row">
          <button id="emptyTrashButton" class="danger-button">ゴミ箱を空にする</button>
        </div>

        <p class="muted small-note">
          ゴミ箱を空にすると、削除済み画像は完全削除されます。
        </p>
      </section>

      <section class="settings-panel">
        <h2>アプリ情報</h2>
        <p class="muted">Archive version <span id="appVersionText">0.3.0</span></p>
      </section>
    </main>
  </div>

  <dialog id="detailDialog" class="detail-dialog">
    <button id="closeDetailButton" class="close-button">×</button>

    <img id="detailImage" alt="保存画像" />

    <div class="detail-body">
      <p id="detailDate" class="muted"></p>

      <label>
        カテゴリ
        <select id="detailCategoryInput">
          <option value="未分類">未分類</option>
          <option value="イラスト">イラスト</option>
          <option value="漫画">漫画</option>
          <option value="アニメ">アニメ</option>
          <option value="ロボ">ロボ</option>
          <option value="服">服</option>
          <option value="背景">背景</option>
          <option value="ポーズ">ポーズ</option>
          <option value="表情">表情</option>
          <option value="構図">構図</option>
          <option value="色彩">色彩</option>
          <option value="その他">その他</option>
        </select>
      </label>

      <label>
        タグ（カンマ区切り）
        <input id="detailTagsInput" type="text" list="tagSuggestions" />
      </label>

      <div class="tag-helper">
        <p class="helper-label">候補タグ</p>
        <div id="detailTagSuggestionChips" class="tag-suggestion-chips"></div>
      </div>

      <label>
        メモ
        <textarea id="detailMemoInput" rows="5"></textarea>
      </label>

      <div class="check-row">
        <label>
          <input id="detailFavoriteInput" type="checkbox" />
          お気に入り
        </label>
        <label>
          <input id="detailNsfwInput" type="checkbox" />
          NSFW
        </label>
      </div>

      <div class="button-row">
        <button id="saveDetailButton" class="primary-button">変更を保存</button>
      </div>
    </div>
  </dialog>

  <dialog id="imagePreviewDialog" class="image-preview-dialog">
    <button id="closePreviewButton" class="close-button">×</button>
    <img id="previewImage" alt="画像プレビュー" />
  </dialog>

  <datalist id="tagSuggestions"></datalist>

  <script src="app.js"></script>
</body>
</html>
